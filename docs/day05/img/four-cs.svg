<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" width="720" height="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <title>The four Cs of cloud-native security: Cloud contains Cluster, which contains Container, which contains Code</title>
  <rect x="1" y="1" width="718" height="204" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="16" y="25" fill="#1f2937"><tspan font-weight="700">Cloud</tspan>: VMs, networks, security groups (Day 1)</text>
  <rect x="21" y="38" width="678" height="151" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="36" y="62" fill="#1f2937"><tspan font-weight="700">Cluster</tspan>: Ingress, certificates, a password at the edge (this section); RBAC (Day 3)</text>
  <rect x="41" y="75" width="638" height="98" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="56" y="99" fill="#1f2937"><tspan font-weight="700">Container</tspan>: non-root, minimal image, scanned (Days 2 and 4)</text>
  <rect x="61" y="112" width="598" height="45" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="140" fill="#1f2937"><tspan font-weight="700">Code</tspan>: input checks, dependencies (scanned on Day 4)</text>
</svg>
